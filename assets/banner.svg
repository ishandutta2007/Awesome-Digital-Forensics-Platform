<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .grid-line { stroke: #1e293b; stroke-width: 1; opacity: 0.4; }
    .anim-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .anim-dash { stroke-dasharray: 12, 12; animation: dashMove 15s linear infinite; }
    .anim-float { animation: floatParticle 4s ease-in-out infinite; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; }
  </style>

  <!-- Dark Canvas Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Animated Background Grid & Circles -->
  <g class="anim-pulse">
    <circle cx="1000" cy="80" r="180" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
    <circle cx="200" cy="260" r="140" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>
    <circle cx="600" cy="160" r="220" fill="#8b5cf6" opacity="0.08" filter="url(#glow)"/>
  </g>

  <!-- Tech Grid Overlay -->
  <g class="grid-line">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Animated Data Streams in Background -->
  <path d="M 50,260 Q 300,100 600,220 T 1150,80" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.6" class="anim-dash"/>
  <path d="M 50,80 Q 400,280 800,120 T 1150,240" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" class="anim-dash"/>

  <!-- Dynamic Nodes (Forensic Data Points) -->
  <g class="anim-float">
    <circle cx="280" cy="120" r="4" fill="#38bdf8"/>
    <circle cx="850" cy="220" r="5" fill="#8b5cf6"/>
    <circle cx="1050" cy="120" r="4" fill="#06b6d4"/>
  </g>

  <!-- Main Card Container behind text for extreme contrast -->
  <rect x="60" y="45" width="1080" height="230" rx="12" fill="#0f172a" opacity="0.75" stroke="#334155" stroke-width="1.5"/>

  <!-- FOREGROUND CONTENT (Title & Subtitle permanently clear and crisp) -->
  <g transform="translate(100, 0)">
    <!-- Category Tag / Pill -->
    <rect x="0" y="78" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="96" class="badge-text">DIGITAL FORENSICS &amp; DFIR</text>

    <!-- Main Title -->
    <text x="0" y="155" class="title-text">Awesome Digital Forensics Platform</text>

    <!-- Gradient Bar accent -->
    <rect x="0" y="172" width="620" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="0" y="215" class="subtitle-text">Curated SaaS Products &amp; High-Impact Open-Source DFIR Ecosystem</text>
    <text x="0" y="242" class="subtitle-text" font-size="15px" fill="#64748b">Disk • Mobile • Memory • Incident Response • Timeline Analysis</text>
  </g>
</svg>
